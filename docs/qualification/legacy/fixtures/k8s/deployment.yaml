apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.3
        - name: disabled
          image: registry.example.invalid/disabled:1.0.0
        - name: failed
          image: ghcr.io/renovate-report-poc-missing/not-a-real-image:1.0.0
        - name: fixed
          image: alpine:3.19.0
