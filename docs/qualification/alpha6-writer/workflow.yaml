name: Isolated alpha.6 PR-triggered CI qualification
on: workflow_dispatch
permissions: {}
concurrency:
  group: isolated-renovate-engine
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the verified published controller against the private fixture
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_ALPHA6_FIXTURE_WRITER }}
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = guilycst/balemoh-renovate-engine-poc-20261101
          test -n "$RENOVATE_TOKEN"
          image=$(python3 - <<'PY'
          import json,re
          from pathlib import Path
          pins=json.loads(Path('qualification/alpha6-pins.json').read_text())
          assert pins['version']=='0.0.1-alpha.6'
          assert pins['sourceCommit']=='f0108bea8b4223a7f0bb2f9f8a52d00af247737f'
          assert re.fullmatch(r'ghcr.io/araihu/balemoh-plugin-renovate@sha256:[a-f0-9]{64}',pins['image'])
          print(pins['image'])
          PY
          )
          mkdir -p "$RUNNER_TEMP/alpha6-ci-output"
          chmod 0777 "$RUNNER_TEMP/alpha6-ci-output"
          for test_case in wrong-digest pinned-tag dockerfile-digest compose-untagged; do
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,uid=12021,gid=12021,mode=1770,size=2g \
            --env QUALIFICATION_CASE="$test_case" \
            --mount "type=bind,source=$PWD/qualification/alpha6-cases.json,target=/qualification-cases.json,readonly" \
            --env RENOVATE_TOKEN --env GITHUB_READ_TOKEN --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --mount "type=bind,source=$PWD/qualification/alpha6-ci.py,target=/qualify.py,readonly" \
            --mount "type=bind,source=$PWD/qualification/alpha6-pins.json,target=/qualification-pins.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/alpha6-ci-output,target=/out" \
            --entrypoint python3 "$image" /qualify.py
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: alpha6-pr-ci-qualification
          path: |
            ${{ runner.temp }}/alpha6-ci-output/*.json
            ${{ runner.temp }}/alpha6-ci-output/*.tar
          retention-days: 30
          if-no-files-found: error
