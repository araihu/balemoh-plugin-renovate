name: Isolated alpha.5 published writer qualification
on: workflow_dispatch
permissions: {}
concurrency:
  group: isolated-renovate-engine
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the verified published controller against the private fixture
        env:
          RENOVATE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = guilycst/balemoh-renovate-engine-poc-20261101
          image=$(python3 - <<'PY'
          import json,re
          from pathlib import Path
          pins=json.loads(Path('qualification/alpha5-pins.json').read_text())
          assert pins['version']=='0.0.1-alpha.5'
          assert pins['sourceCommit']=='ab45eb7a4647e96abf0173c859ae12ce87075862'
          assert re.fullmatch(r'ghcr.io/araihu/balemoh-plugin-renovate@sha256:[a-f0-9]{64}',pins['image'])
          print(pins['image'])
          PY
          )
          mkdir -p "$RUNNER_TEMP/alpha5-output"
          chmod 0777 "$RUNNER_TEMP/alpha5-output"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,uid=12021,gid=12021,mode=1770,size=2g \
            --env RENOVATE_TOKEN --env GITHUB_REPOSITORY --env GITHUB_SHA \
            --mount "type=bind,source=$PWD/qualification/alpha5.py,target=/qualify.py,readonly" \
            --mount "type=bind,source=$PWD/qualification/alpha5-pins.json,target=/qualification-pins.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/alpha5-output,target=/out" \
            --entrypoint python3 "$image" /qualify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: alpha5-writer-qualification
          path: ${{ runner.temp }}/alpha5-output/*.json
          retention-days: 30
          if-no-files-found: error
