name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Generate, test and check the source tree
        run: |
          make test
          test -n "$(go list -m -f '{{.Sum}}' github.com/araihu/balemoh/plugin-sdk)"
          test -z "$(go list -m -f '{{if .Replace}}replaced{{end}}' github.com/araihu/balemoh/plugin-sdk)"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify the pinned Renovate profile and report projection
        run: |
          docker pull "$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)"
          go test -tags container ./internal/runner -count=1
